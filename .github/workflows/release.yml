name: Release

# Push a version tag to build the desktop app for macOS, Windows, and Linux and
# publish a single GitHub Release with every installer attached. Because this
# repo is PRIVATE, the release is published to the PUBLIC downloads repo
# (skazler/mainspring-releases) so anyone can grab the installers without
# seeing the source:
#
#   git tag v1.0.1 && git push origin v1.0.1
#
# How it works: `create` opens an empty DRAFT release in the public repo, then
# each `build` job compiles on its own OS and uploads its installers straight
# onto that draft. Review it in the public repo, then hit Publish to go live.
#
# Installers are NOT passed through Actions artifacts. They used to be — build
# uploaded, publish downloaded — which cost a full round trip through the
# account-wide artifact storage quota. v1.3.0 failed on exactly that: all three
# platforms compiled, then every upload was rejected with "Artifact storage
# quota has been hit", and publish was skipped. That quota is shared across all
# repos and only recalculates every 6-12 hours, so a build here could be broken
# by an unrelated repo and stay broken for half a day. Uploading to the release
# directly removes the dependency rather than shrinking it (`retention-days: 1`
# was the earlier, weaker attempt at the same problem).
#
# Builds are UNSIGNED (no Apple/Windows cert wired in); on macOS, first launch:
# right-click -> Open.

on:
  push:
    tags: ["v*"]

# One release at a time. Two tags pushed together would otherwise race on
# creating the same draft and interleave their uploads onto it.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  RELEASES_REPO: skazler/mainspring-releases

jobs:
  # Open the draft first so the build jobs have somewhere to upload to. Creating
  # it from three parallel jobs instead would race.
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release in the public downloads repo
        env:
          GH_TOKEN: ${{ secrets.MAINSPRING_RELEASES_REPO_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Idempotent: re-running a failed release must not fall over on an
          # existing draft, and must not clobber assets already uploaded.
          if gh release view "$TAG" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            echo "Draft $TAG already exists — reusing it."
            exit 0
          fi
          cat > notes.md <<'EOF'
          Local-first planner for financial independence — your data stays on your machine. Download the installer for your OS below.

          **Builds are unsigned.**
          - **macOS:** it may say *"MAINSPRING is damaged and can't be opened"* — it isn't. Move it to `/Applications`, then run once: `xattr -cr /Applications/MAINSPRING.app` and open it normally.
          - **Windows:** SmartScreen → **More info → Run anyway**.
          EOF
          gh release create "$TAG" \
            --repo "$RELEASES_REPO" \
            --title "MAINSPRING $TAG" \
            --notes-file notes.md \
            --draft

  build:
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          # Universal macOS binary — runs on both Apple Silicon and Intel.
          - os: macos-latest
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - os: windows-latest
            args: ""
            rust-targets: ""
          - os: ubuntu-latest
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      # Tauri v2 Linux prerequisites (webkit2gtk 4.1, appindicator, AppImage).
      - name: Linux build prerequisites
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev \
            patchelf build-essential curl wget file

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Stamp the app version from the tag (v1.2.3 -> 1.2.3) so the installer
      # filenames always match the release, no manual bump needed.
      - name: Sync app version to the tag
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          node -e "const fs=require('fs');const f='apps/desktop/src-tauri/tauri.conf.json';const j=JSON.parse(fs.readFileSync(f,'utf8'));j.version='$VER';fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n')"
          echo "Set app version to $VER"

      # Build only — no tagName/releaseName, so tauri-action compiles the
      # installers without creating a release here in the private repo.
      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ── Code signing (optional) ─────────────────────────────────────────
          # Add these as repository secrets (Settings → Secrets and variables →
          # Actions) to ship installers that open without a security warning.
          # Until then builds are UNSIGNED (macOS: right-click → Open; Windows:
          # SmartScreen "More info → Run anyway").
          #
          # macOS — needs an Apple Developer account (~$99/yr):
          #   APPLE_CERTIFICATE:          ${{ secrets.APPLE_CERTIFICATE }}          # base64 of your Developer ID .p12
          #   APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          #   APPLE_SIGNING_IDENTITY:     ${{ secrets.APPLE_SIGNING_IDENTITY }}     # "Developer ID Application: Name (TEAMID)"
          #   APPLE_ID:                   ${{ secrets.APPLE_ID }}                   # for notarization
          #   APPLE_PASSWORD:             ${{ secrets.APPLE_PASSWORD }}             # app-specific password
          #   APPLE_TEAM_ID:              ${{ secrets.APPLE_TEAM_ID }}
          #
          # Windows — needs a code-signing cert from a CA (or Azure Trusted Signing).
          #   Configure it in apps/desktop/src-tauri/tauri.conf.json under
          #   bundle.windows.certificateThumbprint (+ optional signCommand);
          #   see https://tauri.app/distribute/sign/windows/
          # ────────────────────────────────────────────────────────────────────
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}

      # Upload straight onto the draft — no artifact round trip, so the
      # account-wide artifact quota can't fail a release again.
      #
      # target/ is at the CARGO WORKSPACE ROOT, not apps/desktop/src-tauri.
      # macOS universal builds land under target/universal-apple-darwin/; the
      # ** before release/bundle covers both that and plain target/release.
      - name: Upload installers to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.MAINSPRING_RELEASES_REPO_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # `find`, not a `**` glob: macOS runners still ship bash 3.2, which has
          # neither globstar nor mapfile. The read loop is the portable way to
          # fill an array on 3.2 and stays correct for paths containing spaces.
          files=()
          while IFS= read -r f; do files+=("$f"); done < <(
            find target -type f -path '*/release/bundle/*' \
              \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \
                 -o -name '*.AppImage' -o -name '*.deb' \)
          )
          # A platform legitimately skips formats it doesn't build (no .deb on
          # Windows), so per-extension misses are fine — but producing NOTHING
          # means this OS silently contributed no installer, which would ship a
          # release missing a platform. Fail loudly instead.
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No installers found for ${{ matrix.os }} under target/**/release/bundle/"
            exit 1
          fi
          printf 'uploading: %s\n' "${files[@]}"
          # --clobber so re-running a partially-failed release replaces its own
          # assets instead of erroring on names that are already there.
          gh release upload "$TAG" "${files[@]}" --repo "$RELEASES_REPO" --clobber
