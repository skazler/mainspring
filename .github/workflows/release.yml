name: Release

# Push a version tag to build the desktop app for macOS, Windows, and Linux and
# publish a single GitHub Release with every installer attached (Releases is
# where app binaries live — GitHub "Packages" is for npm/Docker/etc.):
#
#   git tag v1.0.1 && git push origin v1.0.1
#
# The release is created as a DRAFT — review it, then publish to make the
# downloads public. Builds are UNSIGNED (no Apple/Windows cert wired in); on
# macOS, first launch: right-click → Open. Add signing secrets later via
# tauri-action's env (APPLE_CERTIFICATE, WINDOWS_CERTIFICATE, etc.).

on:
  push:
    tags: ["v*"]

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Universal macOS binary — runs on both Apple Silicon and Intel.
          - os: macos-latest
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - os: windows-latest
            args: ""
            rust-targets: ""
          - os: ubuntu-latest
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      # Tauri v2 Linux prerequisites (webkit2gtk 4.1, appindicator, AppImage).
      - name: Linux build prerequisites
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev \
            patchelf build-essential curl wget file

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build + publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: "MAINSPRING ${{ github.ref_name }}"
          releaseBody: "Local-first planner for financial independence — your data stays on your machine. Download the installer for your OS below. Builds are unsigned; on macOS, first launch: right-click → Open."
          releaseDraft: true
          prerelease: false
