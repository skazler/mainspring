name: Release

# Push a version tag to build the desktop app for macOS, Windows, and Linux and
# publish a single GitHub Release with every installer attached. Because this
# repo is PRIVATE, the release is published to the PUBLIC downloads repo
# (skazler/mainspring-releases) so anyone can grab the installers without
# seeing the source:
#
#   git tag v1.0.1 && git push origin v1.0.1
#
# How it works: the `build` job (matrix) compiles the installers on each OS and
# uploads them as workflow artifacts; the `publish` job then attaches all of
# them to ONE release in the public repo, using the MAINSPRING_RELEASES_REPO_TOKEN
# secret (a fine-grained PAT scoped to skazler/mainspring-releases with
# Contents: read/write).
#
# The release is created as a DRAFT — review it in the public repo, then hit
# Publish to make the downloads live. Builds are UNSIGNED (no Apple/Windows cert
# wired in); on macOS, first launch: right-click → Open.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Universal macOS binary — runs on both Apple Silicon and Intel.
          - os: macos-latest
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - os: windows-latest
            args: ""
            rust-targets: ""
          - os: ubuntu-latest
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      # Tauri v2 Linux prerequisites (webkit2gtk 4.1, appindicator, AppImage).
      - name: Linux build prerequisites
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev \
            patchelf build-essential curl wget file

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Stamp the app version from the tag (v1.2.3 -> 1.2.3) so the installer
      # filenames always match the release, no manual bump needed.
      - name: Sync app version to the tag
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          node -e "const fs=require('fs');const f='apps/desktop/src-tauri/tauri.conf.json';const j=JSON.parse(fs.readFileSync(f,'utf8'));j.version='$VER';fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n')"
          echo "Set app version to $VER"

      # Build only — no tagName/releaseName, so tauri-action compiles the
      # installers without creating a release here in the private repo.
      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ── Code signing (optional) ─────────────────────────────────────────
          # Add these as repository secrets (Settings → Secrets and variables →
          # Actions) to ship installers that open without a security warning.
          # Until then builds are UNSIGNED (macOS: right-click → Open; Windows:
          # SmartScreen "More info → Run anyway").
          #
          # macOS — needs an Apple Developer account (~$99/yr):
          #   APPLE_CERTIFICATE:          ${{ secrets.APPLE_CERTIFICATE }}          # base64 of your Developer ID .p12
          #   APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          #   APPLE_SIGNING_IDENTITY:     ${{ secrets.APPLE_SIGNING_IDENTITY }}     # "Developer ID Application: Name (TEAMID)"
          #   APPLE_ID:                   ${{ secrets.APPLE_ID }}                   # for notarization
          #   APPLE_PASSWORD:             ${{ secrets.APPLE_PASSWORD }}             # app-specific password
          #   APPLE_TEAM_ID:              ${{ secrets.APPLE_TEAM_ID }}
          #
          # Windows — needs a code-signing cert from a CA (or Azure Trusted Signing).
          #   Configure it in apps/desktop/src-tauri/tauri.conf.json under
          #   bundle.windows.certificateThumbprint (+ optional signCommand);
          #   see https://tauri.app/distribute/sign/windows/
          # ────────────────────────────────────────────────────────────────────
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}

      # Collect the installers this OS produced. Globs cover every Tauri bundle
      # type; if-no-files-found: ignore so a platform that skips a format (e.g.
      # no .rpm) doesn't fail the job. REPLACE/trim these globs as needed.
      - name: Stage installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/**/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/**/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/**/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/**/release/bundle/**/*.deb

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release to public downloads repo
        uses: softprops/action-gh-release@v2
        with:
          repository: skazler/mainspring-releases
          token: ${{ secrets.MAINSPRING_RELEASES_REPO_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: "MAINSPRING ${{ github.ref_name }}"
          draft: true
          prerelease: false
          files: dist/**/*
          body: |
            Local-first planner for financial independence — your data stays on your machine. Download the installer for your OS below.

            **Builds are unsigned.**
            - **macOS:** it may say *"MAINSPRING is damaged and can't be opened"* — it isn't. Move it to `/Applications`, then run once: `xattr -cr /Applications/MAINSPRING.app` and open it normally.
            - **Windows:** SmartScreen → **More info → Run anyway**.
