# MAINSPRING — optional multi-device sync (Phase 9).
#
# Self-hosted Postgres + ElectricSQL, the read-sync source for local PGlite on a
# second device. This is the opt-in, single-user path (no CRDTs/conflict
# resolution — there are no concurrent multi-user edits). Drop it and nothing
# about the local data model changes.
#
# ⚠️ EXPERIMENTAL / UNVERIFIED. This is scaffolding — pin versions and validate
# against the ElectricSQL docs before relying on it. Runs on one small VPS
# (e.g. Hetzner CX22, ~€4–5/mo). See ./README.md.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: mainspring
      POSTGRES_USER: mainspring
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # logical replication is required by Electric
    command: ["postgres", "-c", "wal_level=logical"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mainspring"]
      interval: 10s
      timeout: 5s
      retries: 5

  electric:
    image: electricsql/electric:latest
    environment:
      DATABASE_URL: postgresql://mainspring:${POSTGRES_PASSWORD:?}@postgres:5432/mainspring
      ELECTRIC_INSECURE: "true" # dev only — front with TLS + auth in production
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
