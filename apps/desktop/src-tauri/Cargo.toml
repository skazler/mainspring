[package]
name = "desktop"
version = "1.1.1"
description = "MAINSPRING — a private, offline-first planner for financial independence."
authors = ["skazler"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sim = { path = "../../../crates/sim" }
ureq = "2"
# Native OS keychain for the Anthropic API key (macOS Keychain / Windows
# Credential Manager / Linux secret-service). Pure-Rust crypto + zbus so it
# builds on CI without system dbus/openssl.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

